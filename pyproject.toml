[project]
# Production pipeline of the cartiflette files (not published on PyPI).
# The client published on PyPI as `cartiflette` lives in python-package/.
name = "cartiflette-pipeline"
version = "0.2.0"
description = "Pipeline producing the cartiflette French borders files"
authors = [
    { name = "Lino Galiana", email = "lino.galiana@insee.fr" },
    { name = "Thomas Grandjean", email = "thomas.grandjean@developpement-durable.gouv.fr" },
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "duckdb==1.5.5",
    "py7zr>=0.20.4",
    "requests>=2.28.2",
    "s3fs>=2023.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "pandas>=2.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartiflette"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
