[project]
# GeoJSON API over the consolidated GeoParquet files (not published on PyPI).
name = "cartiflette-api"
version = "0.2.0"
description = "GeoJSON API over the cartiflette GeoParquet files"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "cartiflette",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3.3,<9",
]

[tool.uv.sources]
cartiflette = { path = "../python-package/cartiflette", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartiflette_api"]

[tool.ruff.lint.isort]
# The client, not the pipeline package at the root of the repository
known-third-party = ["cartiflette"]
known-first-party = ["cartiflette_api"]
