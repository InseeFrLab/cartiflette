name: Lint

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    # Whole repository: pipeline, client, API. Ruff version pinned so that a
    # new release does not fail the build unexpectedly: bump it on purpose.
    - name: Check
      run: uvx ruff@0.16.10 check --output-format=github .
    - name: Format
      run: uvx ruff@0.16.10 format --check --diff .
