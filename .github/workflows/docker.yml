name: Docker build

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Read pipeline version
        id: version
        run: echo "version=v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # The image is tagged with the pipeline version (pyproject.toml), which
        # argo-pipeline/pipeline.yaml references explicitly
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: inseefrlab/cartiflette:${{ steps.version.outputs.version }}
          context: .
