name: Docker build

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
      # API release only: builds the API image, not the pipeline one
      - 'api-*'
  # Build only (no push), to check the image before merging
  pull_request:

jobs:
  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/api-') }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Read pipeline version
        id: version
        run: echo "version=v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # The image is tagged with the pipeline version (pyproject.toml), which
        # argo-pipeline/pipeline.yaml references explicitly
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: inseefrlab/cartiflette:${{ steps.version.outputs.version }}
          context: .

  api:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Read API version
        id: version
        run: echo "version=v$(grep -m1 '^version' api/pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # Tagged with the API version (api/pyproject.toml), which the Argo CD
        # deployment references: bump it, or the image is overwritten
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: inseefrlab/cartiflette-api:${{ steps.version.outputs.version }}
          context: .
          file: api/Dockerfile
