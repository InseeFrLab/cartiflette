apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: cartiflette-pipeline-
  namespace: projet-cartiflette
spec:
  entrypoint: main
  # Last step, whatever the outcome: writes the final status to its log
  onExit: report-status
  serviceAccountName: workflow
  # Pods running at the same time, all years together
  parallelism: 10
  # Stop the whole workflow if it runs longer than this (hung pod...)
  activeDeadlineSeconds: 43200  # 12 h
  # Delete the pods of the steps that succeeded as soon as they finish; the
  # failed ones are kept for `argo logs` until the workflow is deleted
  podGC:
    strategy: OnPodSuccess
  # Delete the workflow itself (and its failed pods) some time after the end
  ttlStrategy:
    secondsAfterSuccess: 120    # 1 day
    secondsAfterFailure: 120   # 7 days, time to look at the logs and retry
  # Shared volume: deleted when the workflow succeeds; kept after a failure so
  # that `argo retry` can reuse the prepared inputs, then deleted with the
  # workflow (ttlStrategy)
  volumeClaimGC:
    strategy: OnWorkflowSuccess
  # Logs of every step archived on S3, so that they survive the deletion of the
  # pods (podGC) and of the workflow: projet-cartiflette/argo-logs/<workflow>/.
  # Written by Argo, outside test/ and production/.
  templateDefaults:
    archiveLocation:
      archiveLogs: true
      s3:
        endpoint: minio.lab.sspcloud.fr
        bucket: projet-cartiflette
        region: us-east-1
        key: "argo-logs/{{workflow.name}}/{{pod.name}}"
        accessKeySecret:
          name: sa-cartiflette
          key: accessKey
        secretKeySecret:
          name: sa-cartiflette
          key: secretKey
  arguments:
    parameters:
      # Millésimes ADMIN EXPRESS COG CARTO / TAGC à produire, liste JSON.
      # Éditions 3-x (shapefile) pour 2021 à 2024, 4-0 à partir de 2025.
      - name: years
        value: '["2025"]'
      # Chemin d'écriture dans le bucket. Le code refuse d'écrire sous
      # "production" sauf si allow_production_write vaut "true".
      - name: path
        value: "test/v0.3.0"
      # Écriture en production : laisser "false". Pour publier, passer
      # -p allow_production_write=true -p path=production
      - name: allow_production_write
        value: "false"
        enum: ["false", "true"]
      # Branche, tag ou commit Git dont le code Python est utilisé
      - name: revision
        value: "main"
      # Image (mapshaper, DuckDB, dépendances), taguée avec la version du pipeline
      - name: image
        value: "inseefrlab/cartiflette:v0.3.0"
  volumeClaimTemplates:
    - metadata:
        name: volume-workflow-tmp
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            # ~1 Gi of prepared inputs per year
            storage: 20Gi

  templates:
    - name: main
      # Years prepared and processed at the same time (downloads, disk space)
      parallelism: 2
      dag:
        tasks:
          # STEP 0: CLONE THE CODE AND CHECK THE WRITE TARGET, BEFORE ANY DOWNLOAD
          - name: check-target
            template: check-target
          # STEPS 1-3, ONE SUB-DAG PER YEAR
          - name: year
            template: year
            dependencies: [ check-target ]
            arguments:
              parameters:
              - name: year
                value: "{{item}}"
            withParam: "{{workflow.parameters.years}}"

    - name: year
      inputs:
        parameters:
        - name: year
      dag:
        tasks:
          # STEP 1: RETRIEVE IGN AND INSEE SOURCES, PREPARE INPUTS
          - name: prepare
            template: prepare
            arguments:
              parameters:
              - name: year
                value: "{{inputs.parameters.year}}"
          # STEP 2: LIST THE JOBS
          - name: list-jobs
            template: list-jobs
            dependencies: [ prepare ]
          # STEP 3: GEOPARQUET, ONE JOB PER (LEVEL, LAYOUT, SIMPLIFICATION, CRS).
          # No GeoJSON: the API (api/) serves it from these files.
          - name: consolidate
            template: consolidate
            dependencies: [ list-jobs ]
            arguments:
              parameters:
              - name: year
                value: "{{inputs.parameters.year}}"
              - name: level_polygons
                value: "{{item.level-polygons}}"
              - name: layout
                value: "{{item.layout}}"
              - name: simplification
                value: "{{item.simplification}}"
              - name: crs
                value: "{{item.crs}}"
            withParam: "{{tasks.list-jobs.outputs.result}}"

    # The code is cloned once, on the shared volume, for all the steps
    # Exit handler. Its log, archived on S3 like the others, is the only trace of
    # the final status once the workflow is deleted (ttlStrategy): one JSON line
    # with the status and the failed nodes (podName, message...), read by
    # argo-pipeline/logs-app. No shell, so the quotes of the JSON are kept.
    - name: report-status
      container:
        image: "{{workflow.parameters.image}}"
        command: [echo]
        args: ['{"status": "{{workflow.status}}", "duration": {{workflow.duration}}, "failures": {{workflow.failures}}}']

    - name: check-target
      inputs:
        artifacts:
          - name: code
            path: /mnt/bin
            git:
              repo: https://github.com/inseefrlab/cartiflette
              revision: "{{workflow.parameters.revision}}"
      container:
        image: "{{workflow.parameters.image}}"
        command: [sh, -c]
        args: ["python /mnt/bin/argo-pipeline/src/check_target.py"]
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt
        env: &env_parameters
          - name: CARTIFLETTE_WRITE_PATH
            value: "{{workflow.parameters.path}}"
          - name: CARTIFLETTE_ALLOW_PRODUCTION_WRITE
            value: "{{workflow.parameters.allow_production_write}}"
          - name: PYTHONPATH
            value: "/mnt/bin"
          - name: LOCAL_DATA_PATH
            value: "/mnt/data"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: sa-cartiflette
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: sa-cartiflette
                key: secretKey
          - name: AWS_DEFAULT_REGION
            value: us-east-1

    - name: prepare
      inputs:
        parameters:
        - name: year
      # Géoplateforme (1 request per second) and Insee downloads
      retryStrategy: &retry
        limit: "2"
        backoff:
          duration: "1m"
          factor: "2"
      container:
        image: "{{workflow.parameters.image}}"
        command: [sh, -c]
        args: ["
                python /mnt/bin/argo-pipeline/src/prepare.py \
                --year {{inputs.parameters.year}} \
                --localpath $LOCAL_DATA_PATH/{{inputs.parameters.year}}
                "]
        env: *env_parameters
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt

    - name: list-jobs
      container:
        image: "{{workflow.parameters.image}}"
        command: [sh, -c]
        args: ["python /mnt/bin/argo-pipeline/src/crossproduct.py"]
        env: *env_parameters
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt

    - name: consolidate
      inputs:
        parameters:
        - name: year
        - name: level_polygons
        - name: layout
        - name: simplification
        - name: crs
      retryStrategy: *retry
      container:
        image: "{{workflow.parameters.image}}"
        command: [sh, -c]
        args: ["
          python /mnt/bin/argo-pipeline/src/consolidate.py \
          --year {{inputs.parameters.year}} \
          --inputs $LOCAL_DATA_PATH/{{inputs.parameters.year}} \
          --level_polygons {{inputs.parameters.level_polygons}} \
          --layout {{inputs.parameters.layout}} \
          --simplification {{inputs.parameters.simplification}} \
          --crs {{inputs.parameters.crs}}"
        ]
        env: *env_parameters
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt
