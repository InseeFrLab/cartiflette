apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: cartiflette-pipeline-
  namespace: projet-cartiflette
spec:
  entrypoint: main
  serviceAccountName: workflow
  parallelism: 20
  arguments:
    parameters:
      # Millésime ADMIN EXPRESS COG CARTO / TAGC à produire
      - name: year
        value: "2025"
      # Chemin d'écriture dans le bucket. Le code refuse d'écrire sous
      # "production" sauf si CARTIFLETTE_ALLOW_PRODUCTION_WRITE est positionné.
      - name: path
        value: "test/v0.2.0"
      # Branche ou tag Git dont le code est utilisé
      - name: revision
        value: "main"
  volumeClaimTemplates:
    - metadata:
        name: volume-workflow-tmp
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi

  templates:
    - name: main
      dag:
        tasks:
          # STEP 1: RETRIEVE IGN AND INSEE SOURCES, PREPARE INPUTS
          - name: prepare
            template: prepare
          # STEP 2: LIST THE JOBS
          - name: list-jobs
            template: list-jobs
            dependencies: [ prepare ]
            arguments:
              parameters:
              - name: kind
                value: "geojson"
          - name: list-parquet-jobs
            template: list-jobs
            dependencies: [ prepare ]
            arguments:
              parameters:
              - name: kind
                value: "parquet"
          # STEP 3a: GEOJSON, ONE JOB PER (LEVEL, FILTER_BY, SIMPLIFICATION, CRS)
          - name: split
            template: split
            dependencies: [ list-jobs ]
            arguments:
              parameters:
              - name: level_polygons
                value: "{{item.level-polygons}}"
              - name: filter_by
                value: "{{item.filter-by}}"
              - name: simplification
                value: "{{item.simplification}}"
              - name: crs
                value: "{{item.crs}}"
            withParam: "{{tasks.list-jobs.outputs.result}}"
          # STEP 3b: GEOPARQUET, ONE JOB PER (LEVEL, GEOMETRY, SIMPLIFICATION, CRS)
          - name: consolidate
            template: consolidate
            dependencies: [ list-parquet-jobs ]
            arguments:
              parameters:
              - name: level_polygons
                value: "{{item.level-polygons}}"
              - name: geometry
                value: "{{item.geometry}}"
              - name: simplification
                value: "{{item.simplification}}"
              - name: crs
                value: "{{item.crs}}"
            withParam: "{{tasks.list-parquet-jobs.outputs.result}}"

    - name: prepare
      inputs:
        artifacts:
          - name: code
            path: /mnt/bin
            git:
              repo: https://github.com/inseefrlab/cartiflette
              revision: "{{workflow.parameters.revision}}"
      container:
        image: inseefrlab/cartiflette:v0.2.0
        command: [sh, -c]
        args: ["
                mkdir -p $LOCAL_DATA_PATH ;
                python /mnt/bin/argo-pipeline/src/prepare.py --year {{workflow.parameters.year}} --localpath $LOCAL_DATA_PATH ;
                "]
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt
        env: &env_parameters
          - name: CARTIFLETTE_WRITE_PATH
            value: "{{workflow.parameters.path}}"
          - name: PYTHONPATH
            value: "/mnt/bin"
          - name: LOCAL_DATA_PATH
            value: "/mnt/data"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: sa-cartiflette
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: sa-cartiflette
                key: secretKey
          - name: AWS_DEFAULT_REGION
            value: us-east-1

    - name: list-jobs
      inputs:
        parameters:
        - name: kind
      container:
        image: inseefrlab/cartiflette:v0.2.0
        command: [sh, -c]
        args: ["python /mnt/bin/argo-pipeline/src/crossproduct.py --kind {{inputs.parameters.kind}}"]
        env: *env_parameters
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt

    - name: split
      inputs:
        parameters:
        - name: level_polygons
        - name: filter_by
        - name: simplification
        - name: crs
      container:
        image: inseefrlab/cartiflette:v0.2.0
        command: [sh, -c]
        args: ["
          python /mnt/bin/argo-pipeline/src/split.py \
          --year {{workflow.parameters.year}} \
          --inputs $LOCAL_DATA_PATH \
          --level_polygons {{inputs.parameters.level_polygons}} \
          --filter_by {{inputs.parameters.filter_by}} \
          --simplification {{inputs.parameters.simplification}} \
          --crs {{inputs.parameters.crs}}"
        ]
        env: *env_parameters
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt

    - name: consolidate
      inputs:
        parameters:
        - name: level_polygons
        - name: geometry
        - name: simplification
        - name: crs
      container:
        image: inseefrlab/cartiflette:v0.2.0
        command: ["sh", "-c"]
        args: ["
          python /mnt/bin/argo-pipeline/src/consolidate.py \
          --year {{workflow.parameters.year}} \
          --inputs $LOCAL_DATA_PATH \
          --level_polygons {{inputs.parameters.level_polygons}} \
          --geometry {{inputs.parameters.geometry}} \
          --simplification {{inputs.parameters.simplification}} \
          --crs {{inputs.parameters.crs}}"
        ]
        env: *env_parameters
        volumeMounts:
          - name: volume-workflow-tmp
            mountPath: /mnt
