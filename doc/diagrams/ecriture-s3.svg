<text x="20.0" y="504.0" font-size="14" text-anchor="start" fill="#495057"><tspan x="20.0" dy="0.0">Contrôle fait deux fois : check_write_target() au début de consolidate_and_upload (avant mapshaper), puis dans upload() pour chaque fichier.</tspan><tspan x="20.0" dy="17.5">Toute écriture passe par cartiflette/s3.py::upload — jamais de fs.put* direct, ni de commande mc.</tspan></text>
